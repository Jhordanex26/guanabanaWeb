<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuetra Historia</title>
    <link rel="icon" href="img/iconPerry.png" type="image/png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- SweetAlert2 para Alertas Bonitas (Mejora UX) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-white text-gray-900 font-body antialiased overflow-x-hidden">

    <section id="romanticismo" class="relative py-24 bg-gray-50 reveal-on-scroll scroll-mt-24">
        <div class="container mx-auto px-4">
            <div class="grid md:grid-cols-2 gap-12 items-center">
                <div class="relative">
                    <div
                        class="absolute inset-0 border-2 border-black transform translate-x-4 translate-y-4 hidden md:block">
                    </div>
                    <img src="img/imgGuanabanaGuitarra.jpg" alt="Pareja Romántica"
                        class="w-full grayscale shadow-lg relative z-10">
                </div>
                <div class="text-center md:text-left">
                    <h3 class="font-title text-3xl mb-4">Nuestro Amor</h3>
                    <p class="text-gray-600 mb-8 italic text-lg">
                        "El amor es paciente y bondadoso..." <br>
                        Cada día que pasa es un paso más cerca de nuestra eternidad juntos.
                    </p>

                    <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 inline-block w-full">
                        <p class="text-xs uppercase tracking-widest mb-4 text-gray-500">Faltan:</p>
                        <div class="flex justify-center md:justify-around gap-4 text-center" id="countdown">
                            <div><span class="block text-3xl font-bold font-title" id="days">00</span><span
                                    class="text-xs">Días</span></div>
                            <div><span class="block text-3xl font-bold font-title" id="hours">00</span><span
                                    class="text-xs">Hs</span></div>
                            <div><span class="block text-3xl font-bold font-title" id="minutes">00</span><span
                                    class="text-xs">Min</span></div>
                            <div><span class="block text-3xl font-bold font-title" id="seconds">00</span><span
                                    class="text-xs">Seg</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="app.js"></script>

</body>

</html>
